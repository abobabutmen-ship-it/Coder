name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pip install pytest
          pytest -q
      - name: Lint (pre-commit)
        run: |
          pip install pre-commit
          pre-commit run --all-files || true

  docker-smoke:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t coder-cli:ci .
      - name: Run smoke test (analyze)
        run: |
          docker run --rm coder-cli:ci python -m core.cli analyze --lang py --code "def f():\n  pass"
